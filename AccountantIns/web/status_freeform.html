<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />


		<title>Search</title>
<script src="js/jquery.js"></script>
	<script type="text/javascript" id="hs-script-loader" async defer src="//js.hs-scripts.com/3334505.js"></script> </head>
	<body>
		<form>
			<div id="status_freeform_freeform_01">
				<table width="100%" border="0" align="center" cellpadding="2"
					cellspacing="0">
					<tr>
						<td class="bgrowyellow">

							<table width="100%" border="0" align="center" cellpadding="2"
								cellspacing="0" id="status_freeform_contextdata_01">

								<tr>
									<td colspan="2" nowrap="nowrap">
										<table border="0" align="center" cellpadding="2"
											cellspacing="0">											
											<tr>
												<td width="43%" >&nbsp;
													
												</td>
												
												<td align="left">
													<div class="defult_tr_errors" id="ajax_error_ApplicationComplete"></div>
												</td>
												<td align="left">
													<div class="defult_tr_errors" id="ajax_error_StatusKey"></div>
												</td>
											</tr>
											<tr>
                                            <td width="43%">&nbsp;</td>
												<td width="5%" nowrap="nowrap">
													Status :
												</td>
												<td align="left">
													<select name="StatusKey" id="ajax_field_StatusKey"
														onChange="showDivAreaStatusFreeform(this.value,StatusKey_Prev.value,Quote_Type.value);" style="width:236px">
														<option value="">
															Select
														</option>
													</select>
													<input type="hidden" name="StatusKey_Prev"
														id="ajax_field_StatusKey_Prev" />
													<input type="hidden" name="Quote_Type"
														id="ajax_field_Quote_Type" />
													<input type="hidden" name="QuoteExpiryDate"
														id="ajax_field_QuoteExpiryDate" />
												</td>

											</tr>
										</table>
										<table width="100%" border="0" cellspacing="0" cellpadding="5"
											id="tbl_AcceptedToIssued" style="display: none">
											<tr>
													<td width="43%" >&nbsp;
													
												</td>
												<td align="left" colspan="2">
													<div class="defult_tr_errors" style="float: left"
														id="ajax_error_PolicyNumber"></div>
												</td>
											</tr>
											<tr>
                                           	<td width="43%" >&nbsp;
													
												</td>
												<td colspan="2" align="center">
													PLEASE BE SURE THIS IS THE RIGHT POLICY! ONCE ISSUED, THIS
													POLICY WILL HAVE TO BE CANCELLED AND REWRITTEN.
												</td>
											</tr>

										</table>
										<table width="100%" border="0" cellspacing="0" cellpadding="2"
											id="tbl_QuotedToIssuedAccepted" style="display: none">
											<tr>
												<td width="150" align="right"></td>
												<td align="left" nowrap>
													<div class="defult_tr_errors"
														id="ajax_error_AcceptanceDate"></div>
												</td>
											</tr>
											<tr>
												<td align="right">
													Acceptance Date :
												</td>
												<td align="left">
													<input type="text" name="AcceptanceDate"
														id="ajax_field_AcceptanceDate" size="10" maxlength="10"
														onClick="attachMMDDYYYYDateFormat(this);" />
													<a title="Select Date" class="calendar-link" id="date_link"
														onClick="show_calendar_widget(this);"><img
															src="img/icon_calendar.gif" alt="calendar" width="12"
															height="12" hspace="4" border="0" /> </a>(MM/DD/YYYY)
												</td>
											</tr>
										</table>
										<table width="100%" border="0" cellspacing="0" cellpadding="2"
											id="tbl_Quote" style="display: none">
											<tr>
												<td width="150" align="right">
													Quote Sent Date :
												</td>
												<td align="left">
													<input type="text" name="QuoteEffectiveDate"
														id="ajax_field_QuoteEffectiveDate" size="10"
														maxlength="10" onClick="attachMMDDYYYYDateFormat(this);" />
													<a title="Select Date" class="calendar-link" id="date_link"
														onClick="show_calendar_widget(this);"><img
															src="img/icon_calendar.gif" alt="calendar" width="12"
															height="12" hspace="4" border="0" /> </a>(MM/DD/YYYY)
												</td>
											</tr>
										</table>
										<table width="100%" border="0" cellspacing="0" cellpadding="2"
											id="tbl_Reason" style="display: none">
											<tr>
													<td width="43%"  colspan="2"></td>
												<td >
													<div class="defult_tr_errors" id="ajax_error_Comment"></div>
												</td>
											</tr>
											<tr>
                                            	<td width="43%">
													
												</td>
												<td width="10%" nowrap="nowrap" valign="top">
													Specify Reason :
												</td>
												<td>
													<!-- <textarea type="text" name="Comment" maxlength="500"
														id="ajax_field_Comment" onKeyUp="limitText(this,1,8000);"></textarea> -->
													<select name="Comment" class="inputbox" id="ajax_field_Comment" >
														<option value="">
															Select
														</option>
													</select>
												</td>
											</tr>
										</table>
										<table width="100%" border="0" cellspacing="0" cellpadding="0">
											<tr>

												<td colspan="2" align="center" style="padding-top: 10px;">
													<table border="0" align="center" cellpadding="2"
														cellspacing="0">
														<tr>
															<td nowrap="nowrap">
																<div
																	style="text-align: center; width: 150; display: inline;">
																	<div class="" style="float: left;">
																		<div id="updateStatus" style="display: block">
																			<a class="btn button1"
																				href="javascript:ajaxsubmitform('list.html','status_freeform.update','','','ajax_sorting');"
																				>Save</a>
																		</div>
																		<div id="updateStatusWithConfirmation"
																			style="display: none">
																			<a class="btn button1"
																				href="javascript:ajaxsubmitform('list.html','status_freeform.updateWithConfirmation','','','ajax_sorting');"
																				>Save</a>
																		</div>
																	</div>
																</div>
															</td>
															<td nowrap="nowrap">
																<div
																	style="text-align: center">
																	<div style="float: left;">
																		<a
																			href="javascript:ajaxsubmitform('list.html','status_freeform.close','','','ajax_sorting');"
																			class="btn button1">Cancel</a>
																	</div>
																</div>
															</td>
														</tr>
													</table>
												</td>
											</tr>
										</table>
									</td>
									
								</tr>

								<tr>
									<td width="200">&nbsp;
										
									</td>
									<td align="left">&nbsp;
										
									</td>
								</tr>
							</table>
						</td>

					</tr>
				</table>
			</div>
			<table id="status_freeform_contextdata_15">
				<tr>
					<td>
						<input type="hidden" name="jsessionid" id="jsessionid" />
					</td>
				</tr>
			</table>

		</form>

	</body>
	

</html>
